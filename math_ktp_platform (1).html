<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Математика КТЖ 5–9 сынып | Күнтізбелік-тақырыптық жоспар</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #0d47a1;
      --success: #0d9488;
      --success-bg: #ccfbf1;
      --assess: #d97706;
      --assess-bg: #fef3c7;
      --alg: #7c3aed;
      --geo: #059669;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 1rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { font-size: 0.8rem; opacity: 0.9; margin-top: 0.15rem; }
    .progress-bar-wrap {
      margin-top: 0.75rem;
      background: rgba(255,255,255,.2);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #4ade80;
      border-radius: 999px;
      transition: width .3s ease;
      width: 0%;
    }
    .progress-text { font-size: 0.75rem; margin-top: 0.35rem; opacity: 0.95; }
    nav.grades {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 90;
      -webkit-overflow-scrolling: touch;
    }
    .grade-btn {
      flex: 0 0 auto;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all .2s;
      color: var(--text);
    }
    .grade-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .grade-btn:active { transform: scale(0.97); }
    .parts-nav {
      display: none;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .parts-nav.visible { display: flex; }
    .part-btn {
      flex: 0 0 auto;
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      border: 2px solid transparent;
      background: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all .2s;
    }
    .part-btn.alg.active { background: var(--alg); color: white; border-color: var(--alg); }
    .part-btn.geo.active { background: var(--geo); color: white; border-color: var(--geo); }
    .part-btn:not(.active):hover { border-color: var(--border); color: var(--text); }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: 5rem;
    }
    .section-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 0.75rem;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1rem;
      cursor: pointer;
      user-select: none;
      background: #f1f5f9;
      border-bottom: 1px solid transparent;
    }
    .section-header:active { background: #e2e8f0; }
    .section-header.open { border-bottom-color: var(--border); }
    .section-num {
      flex: 0 0 auto;
      width: 2rem;
      height: 2rem;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .section-num.alg { background: var(--alg); }
    .section-num.geo { background: var(--geo); }
    .section-title { flex: 1; font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
    .section-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .chevron {
      flex: 0 0 auto;
      width: 1.25rem;
      height: 1.25rem;
      transition: transform .25s;
      color: var(--muted);
    }
    .section-header.open .chevron { transform: rotate(180deg); }
    .topics-list { display: none; padding: 0.5rem; }
    .topics-list.open { display: block; }
    .topic-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.85rem 0.75rem;
      border-radius: 10px;
      margin-bottom: 0.35rem;
      background: #fafbfc;
      border: 1px solid transparent;
      transition: background .15s;
    }
    .topic-item:hover, .topic-item:active { background: #f1f5f9; }
    .topic-item.done { background: var(--success-bg); border-color: #99f6e4; }
    .topic-item.assess { border-left: 3px solid var(--assess); }
    .topic-check {
      flex: 0 0 auto;
      width: 1.5rem;
      height: 1.5rem;
      margin-top: 0.1rem;
      accent-color: var(--success);
      cursor: pointer;
      transform: scale(1.15);
    }
    .topic-body { flex: 1; min-width: 0; }
    .topic-title { font-weight: 600; font-size: 0.9rem; line-height: 1.35; }
    .topic-goals {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.35rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .topic-item.expanded .topic-goals {
      -webkit-line-clamp: unset;
      display: block;
    }
    .topic-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.4rem;
      font-size: 0.7rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--muted);
      font-weight: 500;
    }
    .badge.assess { background: var(--assess-bg); color: #92400e; }
    .badge.hours { background: #dbeafe; color: #1e40af; }
    .expand-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0.2rem 0;
      margin-top: 0.25rem;
      font-weight: 500;
    }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 0 0.75rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      flex: 0 0 auto;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
    }
    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    @media (min-width: 640px) {
      header h1 { font-size: 1.5rem; }
      main { padding: 1.25rem; }
      .section-title { font-size: 1rem; }
    }
    @media (min-width: 768px) {
      .topic-goals { -webkit-line-clamp: 3; }
    }
    @media print {
      header, nav, .parts-nav, .filter-bar { display: none; }
      .topics-list { display: block !important; }
    }
  </style>
</head>

  <header>
    <h1>Математика КТЖ</h1>
    <p>5–9 сынып • Күнтізбелік-тақырыптық жоспар</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <nav class="grades" id="gradeNav"></nav>

    let DATA = null;
    let currentGrade = null;
    let currentPartIdx = 0;
    let currentFilter = 'all';
    const STORAGE_KEY = 'math_ktp_progress_v2';

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch { return {}; }
    }
    function saveProgress(p) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
    }
    function isDone(id) { return !!loadProgress()[id]; }
    function toggleDone(id) {
      const p = loadProgress();
      if (p[id]) delete p[id]; else p[id] = true;
      saveProgress(p);
      updateProgress();
      renderContent();
    }

    function getCurrentPart() {
      if (!DATA || !currentGrade) return null;
      const g = DATA[currentGrade];
      return g.parts[currentPartIdx] || g.parts[0];
    }

    function updateProgress() {
      if (!DATA || !currentGrade) {
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').textContent = '0 / 0 өтілді';
        return;
      }
      const part = getCurrentPart();
      if (!part) return;
      let total = 0, done = 0;
      part.sections.forEach(s => {
        s.topics.forEach(t => {
          total++;
          if (isDone(t.id)) done++;
        });
      });
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${done} / ${total} өтілді (${pct}%)`;
    }

    function renderGrades() {
      const nav = document.getElementById('gradeNav');
      nav.innerHTML = '';
      Object.keys(DATA).sort((a,b)=>a-b).forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'grade-btn' + (currentGrade == g ? ' active' : '');
        btn.textContent = g + '-сынып';
        btn.onclick = () => {
          currentGrade = g;
          currentPartIdx = 0;
          renderGrades();
          renderPartsNav();
          renderContent();
          updateProgress();
        };
        nav.appendChild(btn);
      });
    }

    function renderPartsNav() {
      const nav = document.getElementById('partsNav');
      if (!currentGrade || !DATA[currentGrade]) {
        nav.classList.remove('visible');
        nav.innerHTML = '';
        return;
      }
      const parts = DATA[currentGrade].parts;
      if (parts.length <= 1) {
        nav.classList.remove('visible');
        nav.innerHTML = '';
        return;
      }
      nav.classList.add('visible');
      nav.innerHTML = '';
      parts.forEach((p, i) => {
        const btn = document.createElement('button');
        const isAlg = p.name.includes('Алгебра');
        const isGeo = p.name.includes('Геометрия');
        btn.className = 'part-btn ' + (isAlg ? 'alg' : isGeo ? 'geo' : '') + (currentPartIdx === i ? ' active' : '');
        btn.textContent = p.name;
        btn.onclick = () => {
          currentPartIdx = i;
          renderPartsNav();
          renderContent();
          updateProgress();
        };
        nav.appendChild(btn);
      });
    }

    function renderContent() {
      const cont = document.getElementById('content');
      if (!currentGrade || !DATA[currentGrade]) {
        cont.innerHTML = '<div class="empty-state">Сыныпты таңдаңыз</div>';
        return;
      }
      const part = getCurrentPart();
      if (!part) {
        cont.innerHTML = '<div class="empty-state">Бөлім табылмады</div>';
        return;
      }
      const isAlg = part.name.includes('Алгебра');
      const isGeo = part.name.includes('Геометрия');
      const numClass = isAlg ? 'alg' : isGeo ? 'geo' : '';

      let html = '';
      part.sections.forEach((sec, si) => {
        const topics = sec.topics.filter(t => {
          const done = isDone(t.id);
          if (currentFilter === 'todo') return !done;
          if (currentFilter === 'done') return done;
          if (currentFilter === 'assess') return t.is_assessment;
          return true;
        });
        if (topics.length === 0 && currentFilter !== 'all') return;

        const doneCount = sec.topics.filter(t => isDone(t.id)).length;
        const totalT = sec.topics.length;
        html += `
          <div class="section-card">
            <div class="section-header" data-si="${si}">
              <div class="section-num ${numClass}">${si + 1}</div>
              <div style="flex:1;min-width:0">
                <div class="section-title">${escapeHtml(sec.name)}</div>
                <div class="section-meta">${totalT} сабақ • ${doneCount} өтілді</div>
              </div>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="topics-list" id="topics-${si}">
              ${topics.map(t => renderTopic(t)).join('')}
            </div>
          </div>`;
      });
      if (!html) html = '<div class="empty-state">Сүзгі бойынша тақырып жоқ</div>';
      cont.innerHTML = html;

      cont.querySelectorAll('.section-header').forEach(h => {
        h.onclick = () => {
          h.classList.toggle('open');
          h.nextElementSibling.classList.toggle('open');
        };
      });
      const first = cont.querySelector('.section-header');
      if (first) {
        first.classList.add('open');
        first.nextElementSibling.classList.add('open');
      }
    }

    function renderTopic(t) {
      const done = isDone(t.id);
      const goalsShort = t.goals ? t.goals.replace(/\s*\|\s*/g, ' • ') : '';
      const isTjb = (t.note||'').includes('ТЖБ') || (t.title||'').includes('ТЖБ') || (t.title||'').toLowerCase().includes('жиынтық');
      return `
        <div class="topic-item ${done ? 'done' : ''} ${t.is_assessment ? 'assess' : ''}" data-id="${t.id}">
          <input type="checkbox" class="topic-check" ${done ? 'checked' : ''} 
            onclick="event.stopPropagation(); toggleDone('${t.id}')">
          <div class="topic-body">
            <div class="topic-title">${escapeHtml(t.title)}</div>
            ${goalsShort ? `<div class="topic-goals">${escapeHtml(goalsShort)}</div>
              <button class="expand-btn" onclick="event.stopPropagation(); this.parentElement.parentElement.classList.toggle('expanded'); this.textContent = this.parentElement.parentElement.classList.contains('expanded') ? 'Жасыру' : 'Толығырақ'">Толығырақ</button>` : ''}
            <div class="topic-meta">
              ${t.hours ? `<span class="badge hours">${t.hours} сағ</span>` : ''}
              ${t.date ? `<span class="badge">${escapeHtml(t.date)}</span>` : ''}
              ${t.is_assessment ? `<span class="badge assess">${isTjb ? 'ТЖБ' : 'БЖБ'}</span>` : ''}
              ${t.rs ? `<span class="badge">№${escapeHtml(t.rs)}</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('filterBar').addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderContent();
      }
    });

    function init() {
      DATA = window.__DATA__ || {};
      if (!Object.keys(DATA).length) {
        document.getElementById('content').innerHTML = '<div class="empty-state">Деректер жүктелмеді</div>';
        return;
      }
      currentGrade = Object.keys(DATA).sort((a,b)=>a-b)[0];
      currentPartIdx = 0;
      renderGrades();
      renderPartsNav();
      renderContent();
      updateProgress();
    }
    init();
  </script>
</body>
</html>
